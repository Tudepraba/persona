<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <div class="bg"></div>
    <div class="tag tag-left" id="tagLeft"></div>
    <div class="tag tag-right" id="tagRight"></div>
    <div id="screens"></div>
    <footer class="hints">
      <span><kbd>↑ ↓</kbd> Pilih</span>
      <span><kbd>Enter</kbd> Buka</span>
      <span><kbd>Esc</kbd> Kembali</span>
      <span class="grow"></span>
      <span id="clock"></span>
      <button id="sound" type="button" aria-pressed="false" title="Efek suara">Suara: mati</button>
    </footer>
    <div class="wipe"></div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
